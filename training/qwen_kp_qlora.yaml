# Run from training/ after installing LLaMA-Factory in a separate Linux environment.
# data/kp_plan_train.json and data/kp_plan_val.json must contain human-reviewed plans.
# This is an unexecuted starting configuration; verify CUDA/VRAM and sample lengths first.
model_name_or_path: Qwen/Qwen3-4B-Instruct-2507
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
quantization_bit: 4
quantization_method: bitsandbytes
template: qwen3_nothink
dataset_dir: data
dataset: kp_plan_train
eval_dataset: kp_plan_val
cutoff_len: 8192
packing: false
train_on_prompt: false
output_dir: output/qwen-kp-r16
logging_dir: output/qwen-kp-r16/tensorboard
overwrite_output_dir: false
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 16
gradient_checkpointing: true
learning_rate: 0.0001
num_train_epochs: 2
lr_scheduler_type: cosine
warmup_ratio: 0.05
fp16: true
logging_steps: 5
save_strategy: epoch
eval_strategy: epoch
save_total_limit: 2
report_to: tensorboard
seed: 42
