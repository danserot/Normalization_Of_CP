services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on: [backend]
    mem_limit: 128m
    memswap_limit: 128m
    networks: [app]
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      # Credentials stay on the server; never use VITE_* variables for this key.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_API_URL: ${OPENAI_API_URL:-https://api.openai.com/v1/responses}
      OPENAI_PROXY_URL: ${OPENAI_PROXY_URL:-}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-240}
      OPENAI_MAX_RETRIES: ${OPENAI_MAX_RETRIES:-2}
      OPENAI_MAX_CONCURRENCY: ${OPENAI_MAX_CONCURRENCY:-4}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-minimal}
      MODEL_DOCUMENT_MAX_OUTPUT_TOKENS: ${MODEL_DOCUMENT_MAX_OUTPUT_TOKENS:-24000}
      VISION_MAX_PAGES: ${VISION_MAX_PAGES:-50}
      EXTRACTION_TIMEOUT_SECONDS: ${EXTRACTION_TIMEOUT_SECONDS:-300}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-25}
      DEBUG_TIMINGS: ${DEBUG_TIMINGS:-false}
      EXTRACTION_WORKERS: ${EXTRACTION_WORKERS:-3}
      EXTRACTION_QUEUE_LIMIT: ${EXTRACTION_QUEUE_LIMIT:-8}
      EXTRACTION_QUEUE_WAIT_SECONDS: ${EXTRACTION_QUEUE_WAIT_SECONDS:-120}
      DATABASE_PATH: /data/readdocument.sqlite3
      APP_PASSWORD: ${APP_PASSWORD:-}
      APP_SECRET: ${APP_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - proposal_data:/data
    mem_limit: 2g
    memswap_limit: 2g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 6s
      start_period: 15s
      retries: 3
    # OpenAI needs outbound HTTPS. This network is intentionally not internal.
    networks: [app]
    restart: unless-stopped

networks:
  app:

volumes:
  # Preserve the existing volume name and saved proposals/annotations.
  proposal_data:
