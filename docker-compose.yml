services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_API_URL: ${OPENAI_API_URL:-https://api.openai.com/v1}
      TESSERACT_LANG: ${TESSERACT_LANG:-rus+eng}
      TESSERACT_CONFIG: ${TESSERACT_CONFIG:---oem 1 --psm 6 -c preserve_interword_spaces=1}
      DATABASE_PATH: /data/readdocument.sqlite3
      APP_PASSWORD: ${APP_PASSWORD:-}
      APP_SECRET: ${APP_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - proposal_data:/data
    restart: unless-stopped

volumes:
  proposal_data:
